<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tone.js Random PolySynth</title>
    <!-- Load Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { margin-top: 0; color: #333; }
        
        .note-display { 
            margin-top: 20px; font-family: 'Courier New', monospace; 
            font-size: 1.5em; color: #2c3e50; padding: 10px; background: #ecf0f1; border-radius: 5px;
        }

        button { 
            margin-top: 10px; width: 100%; padding: 15px; font-size: 18px; cursor: pointer; 
            border: none; border-radius: 5px; transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        
        #randBtn { background-color: #27ae60; color: white; font-weight: bold; box-shadow: 0 4px 0 #219150; }
    </style>
</head>
<body>

<div class="container">
    <h1>Random PolySynth Chords</h1>
    <p>Click the button to trigger a random 3-note chord.</p>
    
    <!-- Display for what is currently playing -->
    <div id="visual-feedback" class="note-display">Ready...</div>

    <!-- The Main Trigger Button -->
    <button id="randBtn" onclick="playRandomChord()">PLAY RANDOM CHORD</button>
    
    <small style="margin-top:20px; display:block; color:#7f8c8d;">
        (Logic uses an array to select 3 random frequencies from the C-Major scale)
    </small>
</div>

<script>
    // 1. Define a Musical Scale (C Major - Octave C4 to B4)
    // These are frequencies for white keys only: C, D, E, F, G, A, B
    const cMajorScale = [
        
         {    note: "C3",     freq: 130.81  },
         {    note: "C#3",   freq: 138.59  },
          {    note: "D3",    freq: 146.83  },
          {    note: "D#3",   freq: 155.56  },
          {    note: "E3",    freq: 164.81  },
          {    note: "F3",    freq: 174.61  },
          {    note: "F#3",   freq: 185.00  },
          {    note: "G3",    freq: 196.00  },
          {    note: "G#3",   freq: 207.65  },
          {    note: "A3",    freq: 220.00  },
          {    note: "A#3",   freq: 233.08  },
          {    note: "B3",    freq: 246.94  },
        { note: "C4", freq: 261.63 },
        { note: "D4", freq: 293.66 },
        { note: "E4", freq: 329.63 },
        { note: "F4", freq: 349.23 },
        { note: "G4", freq: 392.00 },
        { note: "A4", freq: 440.00 },
        { note: "B4", freq: 493.88 }
    ];

    // 2. Initialize Tone.js (wait for user interaction to start context)
    let ctx;
    document.body.addEventListener('click', () => { if(!ctx) Tone.start() }, true);

    // 3. Define the Synth
    const synth = new Tone.PolySynth(Tone.Synth, {
        attack: 0.05,
        decay: 0.1,
        detune:0,
        portamento:2,
        sustain: 0.34,
        release: 2 ,
        envelope: {
		"attack": 0.005,
		"attackCurve": "linear",
		"decay": 0.1,
		"decayCurve": "exponential",
		"release": 1,
		"releaseCurve": "exponential",
		"sustain": 0.3
	},
	"oscillator": {
		"partialCount": 0,
		"partials": [],
		"phase": 0,
		"type": "triangle"
	}
    }).toDestination();

    /**
     * FUNCTION TO PLAY RANDOM CHORD
     */
    async function playRandomChord() {
        updateDisplay("Processing...");

        // Step A: Create a pool of our notes to pick from (just the frequency arrays)
        const frequencies = cMajorScale.map(item => item.freq);
        
        // Step B: Select 3 distinct random indices from that pool
        const randomIndices = [];
        for(let i=0; i<3; i++) {
            // Generate a random number between 0 and the length of the array
            let randomIndex = Math.floor(Math.random() * frequencies.length);
            
            // Step C: Add the note. 
            // We push to array so we can pass multiple notes in one triggerAttackRelease call
            // To avoid repeating the exact same frequency (e.g., picking C4, C4, D4),
            // it is safer to pick unique indices if possible, but for 3 notes out of 7 
            // standard random sampling usually works well without complex de-duplication.
            
            // Let's do a simple shuffle/pick to ensure variety
            let available = frequencies.filter(f => !randomIndices.includes(f));
            if(available.length > 0) {
                let pick = available[Math.floor(Math.random() * available.length)];
                randomIndices.push(pick);
            } else {
                 // Fallback: just pick remaining even if repeat (rare case here)
                 randomIndices.push(frequencies[0]);
            }
        }

        // Step D: Play the array of frequencies simultaneously
        await synth.triggerAttackRelease(randomIndices, '2n'); // 1 whole note length
        
        // Show result (e.g., "C4 - G4 - E4")
        const notesStr = randomIndices.map(f => {
            // Find the closest note name from our scale for display purposes
            return cMajorScale.find(n => Math.abs(n.freq - f) < 0.01).note;
        }).join(", ");

        updateDisplay(`Playing: ${notesStr}`);
        console.log(`Playing: ${notesStr}`)
    }

    function updateDisplay(text) {
        document.getElementById('visual-feedback').innerText = text;
    }

// https://www.codechef.com/html-online-compiler
</script>
</body>
</html>
